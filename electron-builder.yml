appId: com.clova.clovasweep
productName: ClovaSweep
copyright: Copyright © 2026 Clova Suite

directories:
  output: release
  buildResources: build

# Only ship the compiled output + the runtime resources.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
      - '!icon-cache/**'

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # A tray-first utility, but it still presents a normal window, so it is not
    # a pure agent (LSUIElement); the dock icon is toggled at runtime instead.
    NSSupportsAutomaticGraphicsSwitching: true

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # No code-signing certificate is configured; builds are unsigned.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClovaSweep
  uninstallDisplayName: ClovaSweep
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

# electron-builder should not try to fetch release notes / publish.
publish: null
