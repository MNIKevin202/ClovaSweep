name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck (frontend)
        run: npm run typecheck

      - name: Lint (frontend)
        run: npm run lint

      - name: Test (frontend)
        run: npm test

      - name: Lint (Rust)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build installers
        run: npx --no-install tauri build --ci
        env:
          # No signing certificate in CI — build unsigned artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ''
          CI: 'true'

      - name: List built installers
        shell: bash
        run: |
          find src-tauri/target/release/bundle -maxdepth 2 -type f \( -iname "*.dmg" -o -iname "*.exe" -o -iname "*.msi" -o -iname "*.app.tar.gz" \) 2>/dev/null || true

      # Best-effort: a full GitHub Actions storage quota must not fail the
      # build, which has already produced valid installers in the previous
      # step.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: clovasweep-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: false

      # Mirrors .dmg/.exe installers to the public downloads-only repo
      # (github.com/MNIKevin202/ClovaSweep-releases). Skipped automatically
      # until RELEASES_REPO_TOKEN is added as a repo secret — see README.md
      # "Publishing to the public releases repo".
      - name: Publish to public releases repo (tags only)
        if: startsWith(github.ref, 'refs/tags/') && env.RELEASES_REPO_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASES_REPO: MNIKevin202/ClovaSweep-releases
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --repo "$RELEASES_REPO" --title "ClovaSweep ${TAG#v}" \
            --notes "Automated release from CI (${GITHUB_SHA::7})." --skip-existing || true
          shopt -s nullglob
          FILES=(src-tauri/target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi)
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release upload "$TAG" --repo "$RELEASES_REPO" --clobber "${FILES[@]}"
          fi
